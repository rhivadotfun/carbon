[package]
name = "carbon-yellowstone-grpc-datasource"
description = "Yellowstone gRPC Datasource"
license = { workspace = true }
version = "1.0.0"
edition = { workspace = true }
readme = "README.md"
repository = { workspace = true }
keywords = ["solana", "indexer", "yellowstone", "datasource"]
categories = ["encoding"]

[lib]
crate-type = ["rlib"]

[features]
batch = ["carbon-core/batch"]

[dependencies]

async-trait = { workspace = true }

carbon-core = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
log = { workspace = true }

solana-account = { workspace = true }
solana-pubkey = { workspace = true }
solana-signature = { workspace = true }
solana-system-interface = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
yellowstone-grpc-client = { workspace = true }
yellowstone-grpc-convert = { path = "../../crates/yellowstone-grpc-convert" }
yellowstone-grpc-proto = { workspace = true }
